name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle and enforce size budgets
        run: npm run ci:build

      - name: Upload production bundle
        uses: actions/upload-artifact@v6
        with:
          name: storyforge-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
