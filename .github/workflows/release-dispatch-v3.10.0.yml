name: Dispatch StoryForge v3.10.0 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-dispatch-v3.10.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: github.repository == 'daaass142/storyforge'
    steps:
      - name: Checkout release-prepared main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "3.10.0"
          grep -q '^## v3\.10\.0' CHANGELOG.md
          grep -Fq '| 应用语义版本 | `3.10.0` | `package.json` |' docs/ARCHITECTURE.md

      - name: Remove one-shot dispatcher from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-dispatch-v3.10.0.yml
          git commit -m "chore(release): remove one-shot v3.10.0 dispatcher"
          git push origin HEAD:main

      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo daaass142/storyforge \
            --ref main \
            -f tag=v3.10.0 \
            -f prerelease=false
