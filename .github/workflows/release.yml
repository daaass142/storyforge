name: Release Source Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v3.10.1'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  checks: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve release commit
        shell: bash
        run: |
          set -euo pipefail
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify release version and changelog
        run: node scripts/check-release-metadata.mjs "${RELEASE_TAG}"

      - name: Verify required CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          required_checks=(
            "Quality"
            "Critical Tests"
            "E2E"
            "Build"
            "Dependency Audit"
          )

          checks="$(
            gh api --paginate               -H "Accept: application/vnd.github+json"               "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100"               --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv'
          )"

          printf '%s\n' "$checks"

          failed=0
          for name in "${required_checks[@]}"; do
            if ! awk -F '\t' -v required="$name"               '$1 == required && $2 == "completed" && $3 == "success" { found = 1 } END { exit(found ? 0 : 1) }'               <<< "$checks"; then
              echo "Required check is missing or not successful: $name" >&2
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Release blocked: target commit ${TARGET_SHA} has not passed every required workflow." >&2
            exit 1
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          mkdir -p release
          cat > release/RELEASE-NOTES.md <<'EOF'
          ## StoryForge 故事熔炉

          本版本为源码版发布，不再提供 `.bat`、`.exe` 或 Windows Portable 启动器。

          ### 如何启动

          1. 在本页面下载 GitHub 自动生成的 `Source code (zip)`。
          2. 解压压缩包。
          3. 安装 Node.js LTS：https://nodejs.org/
          4. 进入包含 `package.json` 的项目目录。
          5. 执行：

             ```powershell
             npm install
             npm run dev
             ```

          6. 浏览器打开：

             ```text
             http://localhost:1111/storyforge/
             ```

          更详细的零基础步骤见仓库内文档：

          `使用npm指令启动项目.md`

          使用前建议先在旧版本「数据管理」中导出 JSON 备份。
          EOF

      - name: Ensure tag exists for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            if [ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "${TARGET_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} does not point to the current release commit." >&2
              exit 1
            fi
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "StoryForge ${RELEASE_TAG}" \
              --notes-file release/RELEASE-NOTES.md \
              "${args[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "StoryForge ${RELEASE_TAG}" \
              --notes-file release/RELEASE-NOTES.md \
              "${args[@]}"
          fi
