name: Dispatch compiled v3.10.1 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-dispatch-v3.10.1.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-dispatch-v3.10.1.yml
          git commit -m "chore(release): remove one-shot v3.10.1 dispatcher"
          git push origin HEAD:main

      - name: Dispatch compiled release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo daaass142/storyforge \
            --ref main \
            -f tag=v3.10.1 \
            -f commit=7c94dec111e11c7fc943835e485ef9418986a3e4 \
            -f prerelease=false \
            -f overwrite=true
