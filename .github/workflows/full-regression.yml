name: Full Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-regression:
    name: Full Regression & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete Vitest suite and coverage thresholds
        run: npm run test:coverage
